name: Cross-compile for Windows

on:
  push:
    branches: [ dev ]
jobs:
  build:
    name: Build for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-gnu
          override: true

      # Cache Rust dependencies to speed up builds
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            **/Cargo.lock
            **/Cargo.toml

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install mingw dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            mingw-w64 \
            nasm

      # Add Cargo configuration for cross-compilation
      - name: Configure Cargo
        run: |
          mkdir -p .cargo
          echo '[target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-gcc-ar"' >> .cargo/config.toml

      - name: Build for Windows
        uses: actions-rs/cargo@v1
        env:
          # Specify cross-compiler paths explicitly
          CC_x86_64_pc_windows_gnu: "x86_64-w64-mingw32-gcc"
          CXX_x86_64_pc_windows_gnu: "x86_64-w64-mingw32-g++"
        with:
          command: build
          args: --release --target x86_64-pc-windows-gnu

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: target/x86_64-pc-windows-gnu/release/*.exe